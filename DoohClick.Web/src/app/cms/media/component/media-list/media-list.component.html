<div class="flex align-items-center gap-2 mt-2 pl-3">
  <h2 class="text-2xl font-semibold m-0" style="color: var(--surface-600)">
    Media
  </h2>
  <p-badge [value]="0" severity="secondary" />
</div>

<div class="card grid-wrapper">
  <p-table
    [scrollable]="true"
    scrollHeight="flex"
    [value]="[]"
    [paginator]="true"
    [rows]="0"
    [totalRecords]="0"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} screens"
    [rowsPerPageOptions]="[10, 20, 30]"
    [lazy]="true"
  >
    <ng-template pTemplate="caption">
      <div class="flex align-items-center justify-content-between gap-3">
        <form class="grid flex-1" style="max-width: 800px">
          <div class="col-12 md:col-4">
            <span class="p-input-icon-left w-full">
              <i class="pi pi-search"></i>
              <input
                pInputText
                formControlName="searchText"
                type="text"
                placeholder="Search..."
                class="w-full"
              />
            </span>
          </div>
          <div class="col-12 md:col-4">
            <p-dropdown
              [options]="[
                { label: 'Active', value: true },
                { label: 'Inactive', value: false },
              ]"
              optionLabel="label"
              optionValue="value"
              placeholder="status"
              styleClass="w-full"
            />
          </div>
          <div class="col-12 md:col-4">
            <p-multiSelect
              optionLabel="item"
              optionValue="code"
              placeholder="Media type"
              styleClass="w-full"
            />
          </div>

          <div class="col-12 md:col-4">
            <p-multiSelect
              optionLabel="item"
              optionValue="code"
              placeholder="Resolution"
              styleClass="w-full"
            />
          </div>

          <div class="col-12 md:col-4 flex align-items-center gap-2">
            <p-button
              label="Apply"
              icon="pi pi-filter"
              size="small"
              styleClass="w-full"
            />
            <p-button
              label="Reset"
              icon="pi pi-filter-slash"
              severity="secondary"
              size="small"
              [outlined]="true"
              styleClass="w-full"
            />
          </div>
        </form>

        <div class="flex gap-2 flex-shrink-0">
          <p-button
            icon="pi pi-upload"
            label="Export"
            severity="secondary"
            size="small"
            [outlined]="true"
            [disabled]="true"
          />
          <p-button icon="pi pi-plus" label="Add Media" size="small" />
          <p-button
            icon="pi pi-refresh"
            label="Refresh"
            size="small"
            severity="secondary"
          >
          </p-button>
        </div>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th
          *ngFor="let col of gridConfig.column"
          [style.width]="col.width || '5rem'"
        >
          {{ col.displayName }}
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-media>
      <ng-container
        *ngIf="gridConfig.dataSource.totalRows > 0; else noDataGrid"
      >
      </ng-container>
      <ng-template #noDataGrid>
        <tr>
          <td [attr.colspan]="gridConfig.column.length" class="text-center p-4">
            <div class="flex justify-content-center align-items-center w-full">
              <p class="m-0">No Data</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </ng-template>
  </p-table>
</div>
