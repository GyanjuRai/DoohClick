<p-confirmDialog></p-confirmDialog>
<div class="flex align-items-center gap-2 my-3 pl-3">
  <h2 class="text-2xl font-semibold m-0" style="color: var(--surface-600)">
    Media
  </h2>
  <p-badge [value]="gridConfig.dataSource.totalRows" severity="secondary" />
</div>

<div class="card grid-wrapper">
  <p-table
    [scrollable]="true"
    [loading]="isTableLoading"
    scrollHeight="flex"
    [value]="gridConfig.dataSource.data"
    [paginator]="true"
    [rows]="gridConfig.options.pageSize"
    [totalRecords]="gridConfig.dataSource.totalRows"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} medias"
    [rowsPerPageOptions]="[10, 20, 30]"
    [lazy]="true"
    (onLazyLoad)="onPageChange($event)"
  >
    <ng-template pTemplate="caption">
      <div class="flex align-items-center justify-content-between gap-3">
        <div class="grid flex-1" style="max-width: 800px">
          <div class="col-12 md:col-5">
            <span class="p-input-icon-left w-full">
              <i class="pi pi-search"></i>
              <input
                pInputText
                [(ngModel)]="gridConfig.options.searchText"
                type="text"
                placeholder="Search..."
                class="w-full"
                (keyup.enter)="onSearchText()"
              />
            </span>
          </div>
          <div class="col-12 md:col-4">
            <p-multiSelect
              [options]="[
                { item: 'Video', code: true },
                { item: 'Image', code: false },
              ]"
              [(ngModel)]="mediaTypeList"
              optionLabel="item"
              optionValue="code"
              placeholder="Media type"
              styleClass="w-full"
              (onChange)="onMediaTypeChange()"
            />
          </div>
          <div class="col-12 md:col-3">
            <p-toggleButton
              [(ngModel)]="isArchived"
              (onChange)="onArchiveFilterChange()"
              onLabel="Archived"
              offLabel="Archived"
            />
          </div>
        </div>

        <div class="flex gap-2 flex-shrink-0">
          <p-button
            icon="pi pi-upload"
            label="Export"
            severity="secondary"
            size="small"
            [outlined]="true"
            [disabled]="true"
          />
          <p-button
            icon="pi pi-plus"
            label="Add Media"
            size="small"
            (onClick)="mediaAddEdit.open()"
          />
          <p-button
            icon="pi pi-refresh"
            label="Refresh"
            size="small"
            severity="secondary"
            (onClick)="onRefresh()"
          >
          </p-button>
        </div>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th
          *ngFor="let col of gridConfig.column"
          [style.width]="col.width || '5rem'"
        >
          {{ col.displayName }}
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-media>
      <tr>
        <td *ngFor="let col of gridConfig.column">
          <ng-container *ngIf="col.type === 'action'; else previewCheck">
            <div class="flex justify-content-center">
              <p-menu
                #menu
                [model]="actionMenuItems"
                [popup]="true"
                appendTo="body"
                styleClass="p-2"
              />
              <p-button
                pRipple
                size="small"
                (onClick)="openActionMenu($event, menu, media)"
              >
                <ng-template pTemplate="content">
                  <i class="pi pi-cog"></i>
                  <span class="mx-2">Actions</span>
                  <i class="pi pi-chevron-down"></i>
                </ng-template>
              </p-button>
            </div>
          </ng-container>

          <ng-template #previewCheck>
            <ng-container *ngIf="col.type === 'preview'; else dateCheck">
              <div
                class="flex justify-content-center align-items-center"
                style="height: 60px"
              >
                <ng-container *ngIf="!media.isVideo; else videoPreview">
                  <p-image
                    [src]="apiUrl + media.fileUrl"
                    [alt]="media.displayName"
                    width="80"
                    height="60"
                    [preview]="true"
                    [imageStyle]="{
                      'object-fit': 'cover',
                      'border-radius': '4px',
                      cursor: 'pointer',
                    }"
                  />
                </ng-container>

                <ng-template #videoPreview>
                  <div
                    class="video-thumb-wrapper"
                    (click)="openVideoPreview(media)"
                    pRipple
                    pTooltip="Click to preview"
                    tooltipPosition="top"
                  >
                    <video
                      [src]="apiUrl + media.fileUrl"
                      width="80"
                      height="60"
                      style="
                        object-fit: cover;
                        border-radius: 4px;
                        pointer-events: none;
                      "
                      preload="metadata"
                    ></video>
                    <div class="video-play-overlay">
                      <i class="pi pi-play-circle"></i>
                    </div>
                  </div>
                </ng-template>
              </div>
            </ng-container>
          </ng-template>

          <ng-template #dateCheck>
            <ng-container *ngIf="col.type === 'date'; else badgeCheck">
              {{ media[col.name] | date: "yyyy MMMM dd" }}
            </ng-container>
          </ng-template>

          <ng-template #badgeCheck>
            <ng-container *ngIf="col.type === 'badge'; else defaultCell">
              <ng-container *ngIf="col.name === 'isVideo'; else statusBadge">
                <p-tag
                  [value]="media[col.name] ? 'Video' : 'Image'"
                  [severity]="media[col.name] ? 'info' : 'success'"
                />
              </ng-container>

              <ng-template #statusBadge>
                <p-tag
                  [value]="media[col.name]"
                  [severity]="
                    media[col.name] === 'ACTIVE' ? 'success' : 'secondary'
                  "
                />
              </ng-template>
            </ng-container>
          </ng-template>

          <ng-template #defaultCell>
            {{
              col.name !== "durationSec"
                ? media[col.name]
                : (media[col.name] ?? 0) + "s"
            }}
          </ng-template>
        </td>
      </tr>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="gridConfig.column.length" class="text-center p-4">
            <div class="flex justify-content-center align-items-center w-full">
              <p class="m-0">No Data</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="videoDialogVisible"
  [modal]="true"
  [dismissableMask]="true"
  position="top"
  [showHeader]="false"
  styleClass="video-preview"
  [style]="{ background: 'transparent', boxShadow: 'none' }"
  contentStyleClass="p-0"
>
  <div class="flex flex-column align-items-center gap-3 p-1">
    <video
      *ngIf="selectedVideoUrl"
      [src]="selectedVideoUrl"
      controls
      autoplay
      style="max-width: 80vw; max-height: 70vh"
    ></video>
  </div>
  <ng-template pTemplate="footer">
    <ng-container>
      <p-button
        icon="pi pi-times"
        label="Close"
        severity="secondary"
        size="small"
        [outlined]="false"
        (onClick)="closeVideoPreview()"
      />
    </ng-container>
  </ng-template>
</p-dialog>

<media-add-edit
  #mediaAddEdit
  (afterClose)="afterDialogClose($event)"
></media-add-edit>
