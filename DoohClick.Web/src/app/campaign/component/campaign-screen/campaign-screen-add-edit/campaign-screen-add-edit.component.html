<p-dialog
  [modal]="true"
  [(visible)]="isDialogOpen"
  [maximizable]="true"
  [draggable]="false"
  position="top"
  [style]="{ width: '60rem', height: '65vh', marginTop: '0.5rem' }"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
>
  <ng-template pTemplate="header">
    <span class="font-semibold">{{
      campaignScreen.screenName + " — Schedule & Playlist"
    }}</span>
  </ng-template>

  <!-- Form -->
  <div class="form-wrapper">
    <div class="form-field">
      <label>Day of week</label>
      <p-dropdown
        [(ngModel)]="selectedDayOfWeek"
        name="dayOfWeek"
        placeholder="Select"
        [options]="dayList"
        optionLabel="item"
        optionValue="code"
        [filter]="true"
        [style]="{ width: '160px' }"
      />
    </div>

    <div class="form-field">
      <label>Start time</label>
      <p-calendar
        [(ngModel)]="selectedStartTime"
        name="startTime"
        [timeOnly]="true"
        [showSeconds]="true"
        [hourFormat]="'24'"
        styleClass="form-calendar"
        [style]="{ width: '130px' }"
      />
    </div>

    <div class="form-field">
      <label>End time</label>
      <p-calendar
        [(ngModel)]="selectedEndTime"
        name="endTime"
        [showSeconds]="true"
        [timeOnly]="true"
        [hourFormat]="'24'"
        styleClass="form-calendar"
        [style]="{ width: '130px' }"
      />
    </div>

    <div class="form-field">
      <label>Media</label>
      <p-multiSelect
        [(ngModel)]="selectedMediaIds"
        name="media"
        [options]="mediaDdl"
        optionLabel="displayName"
        optionValue="id"
        placeholder="Select Media"
        display="chip"
        [appendTo]="'body'"
        [style]="{ width: '200px' }"
      />
    </div>

    <div class="form-field form-field--btn">
      <label>&nbsp;</label>
      <p-button icon="pi pi-plus" label="Add" (onClick)="onAddSchedule()" />
    </div>
  </div>

  <p-table
    [value]="visibleSchedules"
    styleClass="p-datatable-sm"
    [tableStyle]="{ 'min-width': '80%' }"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 40px"></th>
        <th>Day</th>
        <th>Time slot</th>
        <th>Playlist</th>
        <th style="width: 60px"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-schedule>
      <tr class="cursor-pointer" (click)="toggleSchedule(schedule.tempId)">
        <td>
          <i
            class="pi"
            [ngClass]="
              expandedScheduleId === schedule.tempId
                ? 'pi-chevron-down'
                : 'pi-chevron-right'
            "
          ></i>
        </td>
        <td><p-tag [value]="schedule.dayOfWeek" severity="secondary" /></td>
        <td class="text-color-secondary">
          {{ schedule.startTime | slice: 0 : 8 }} –
          {{ schedule.endTime | slice: 0 : 8 }}
        </td>
        <td>
          <p-tag
            [value]="
              schedule.playlist.length +
              ' item' +
              (schedule.playlist.length !== 1 ? 's' : '')
            "
            severity="info"
            icon="pi pi-list"
          />
        </td>
        <td>
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            size="small"
            (onClick)="removeSchedule(schedule, $event)"
          />
        </td>
      </tr>

      <tr *ngIf="expandedScheduleId === schedule.tempId">
        <td colspan="5" class="p-0">
          <div class="playlist-wrapper">
            <p-table
              [value]="schedule.playlist"
              styleClass="p-datatable-sm"
              [tableStyle]="{ 'min-width': '80%' }"
            >
              <ng-template pTemplate="header">
                <tr>
                  <th style="width: 60px">Order</th>
                  <th style="width: 200px;">Media</th>
                  <th style="width: 10px !important">Duration</th>
                </tr>
              </ng-template>

              <ng-template pTemplate="body" let-item let-i="rowIndex">
                <tr>
                  <td>
                    <div class="flex flex-column align-items-center gap-1">
                      <p-button
                        icon="pi pi-chevron-up"
                        [text]="true"
                        size="small"
                        [disabled]="i === 0"
                        (onClick)="moveUp(schedule, i)"
                      />
                      <span class="text-sm font-medium">{{
                        item.playOrder
                      }}</span>
                      <p-button
                        icon="pi pi-chevron-down"
                        [text]="true"
                        size="small"
                        [disabled]="i === schedule.playlist.length - 1"
                        (onClick)="moveDown(schedule, i)"
                      />
                    </div>
                  </td>
                  <td>
                    <div class="flex align-items-center gap-2">
                      <ng-container
                        *ngIf="isImage(item.fileUrl); else videoThumb"
                      >
                        <img
                          [src]="item.fileUrl"
                          class="media-thumb"
                          [alt]="item.displayName"
                        />
                      </ng-container>

                      <ng-template #videoThumb>
                        <div class="media-thumb video-placeholder">
                          <i class="pi pi-video"></i>
                        </div>
                      </ng-template>
                      <span>{{ item.displayName }}</span>
                    </div>
                  </td>
                  <td>
                    <p-inputNumber
                      [(ngModel)]="item.durationSeconds"
                      [name]="'dur_' + i"
                      [min]="1"
                      suffix="s"
                    />
                  </td>
                </tr>
              </ng-template>

              <ng-template pTemplate="emptymessage">
                <tr>
                  <td colspan="4" class="text-center p-3 text-color-secondary">
                    No media added
                  </td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center p-4 text-color-secondary">
          No schedules added yet
        </td>
      </tr>
    </ng-template>
  </p-table>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2">
      <p-button
        label="Cancel"
        (onClick)="_afterClose('cancel')"
        icon="pi pi-times"
        severity="secondary"
      />
      <p-button label="Save" (onClick)="_afterClose('save')" icon="pi pi-save" />
    </div>
  </ng-template>
</p-dialog>
