<p-toast></p-toast>
<p-breadcrumb [model]="breadcrumbItems" class="mb-3" />

<div class="flex align-items-center gap-3 my-3 pl-3">
  <div class="flex align-items-center gap-2">
    <h2 class="text-2xl font-semibold m-0" style="color: var(--surface-600)">
      {{ "Campaign Media - " + campaignName }}
    </h2>
    <p-badge [value]="screens.length" severity="secondary" />
  </div>
  <p-button
    icon="pi pi-arrow-left"
    pTooltip="Back to Campaign"
    tooltipPosition="bottom"
    iconPos="left"
    severity="contrast"
    [outlined]="true"
    (onClick)="redirectToCampaign()"
  />
</div>

<div class="grid-wrapper">
  <div class="flex flex-column gap-4">
    <div
      *ngFor="let screen of screens"
      class="border-1 border-300 surface-0 p-2 border-round-lg overflow-hidden"
    >
      <div class="flex align-items-center gap-3 p-3">
        <div class="flex flex-column gap-1 flex-1">
          <p-tag [value]="flightDateLabel(screen)" styleClass="tag-flight" />
          <div class="flex align-items-center gap-4">
            <span class="screen-name">{{ screen.screenName }}</span>

            <p-button
              icon="pi pi-plus"
              pTooltip="Manage schedule & playlist"
              tooltipPosition="bottom"
              (onClick)="campaignScreenAddEdit.open(screen, advertiserId)"
              pRipple
            >
            </p-button>
          </div>

          <div class="flex flex-column gap-3 text-color-secondary text-sm">
            <span class="meta-text">
              {{ screen.screenCity }}, {{ screen.screenCountry }}
            </span>
            <span class="meta-text">
              {{ screen.screenResolution }}
            </span>
          </div>
        </div>

        <div class="border-top-1 surface-border p-3">
          <p-table
            [value]="screen.campaignScreenSchedules"
            styleClass="p-datatable-sm schedule-table"
            [tableStyle]="{ 'min-width': '100%' }"
          >
            <ng-template pTemplate="header">
              <tr>
                <th *ngFor="let col of columns" [style.width]="col.width">
                  {{ col.displayName }}
                </th>
              </tr>
            </ng-template>

            <ng-template pTemplate="body" let-schedule>
              <tr>
                <td *ngFor="let col of columns">
                  <ng-container [ngSwitch]="col.name">
                    <ng-container *ngSwitchCase="'dayOfWeek'">
                      <p-tag
                        [value]="schedule.dayOfWeek"
                        styleClass="tag-neutral"
                      />
                    </ng-container>

                    <ng-container *ngSwitchCase="'timeSlot'">
                      {{ schedule.startTime | slice: 0 : 5 }} –
                      {{ schedule.endTime | slice: 0 : 5 }}
                    </ng-container>

                    <ng-container *ngSwitchCase="'playlist'">
                      <p-tag
                        [value]="
                          schedule.playlist.length +
                          ' item' +
                          (schedule.playlist.length !== 1 ? 's' : '')
                        "
                        styleClass="tag-info"
                        icon="pi pi-list"
                      />
                    </ng-container>
                  </ng-container>
                </td>
              </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
              <tr>
                <td [attr.colspan]="columns.length" class="text-center p-4">
                  <span class="text-color-secondary">No entries</span>
                </td>
              </tr>
            </ng-template>
          </p-table>
        </div>
      </div>
    </div>

    <div class="justify-content-center" *ngIf="screens.length === 0">
      <span class="text-color-secondary">No Screen Medias</span>
    </div>
  </div>
</div>

<campaign-screen-add-edit
  #campaignScreenAddEdit
  (afterClose)="afterFormClose($event)"
></campaign-screen-add-edit>
